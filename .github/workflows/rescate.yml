name: rescate
# Chat 156 de la app (3-nov-2026): rescate rápido de un hueco de kills (caída de la API de Albion) repartido en varias
# máquinas, cada una con su IP y su propio cupo de Albion (el límite es por IP y por minuto). Ver `rescate.mjs`.
# Lo pide solo `scrape.js` cuando una región vuelve con un hueco grande (`pedirRescate`); también se puede correr a mano.
# Cada máquina sube su parte a la MISMA release `rescate-<región>-…`; `scrape.js` las descubre y las carga sin duplicar.
# Gratis: repo público (GitHub no cobra Actions en repos públicos).
on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Servidor'
        required: true
        type: choice
        options: [americas, europe, asia]
      # Parte 207: `desde`/`hasta` ya no son obligatorios en el formulario (el modo `ids` no los usa); el modo `gremios`
      # los sigue exigiendo en el paso «preparar».
      desde:
        description: 'Comienzo del hueco (ISO, UTC), p. ej. 2026-11-01T02:30:00Z (modo gremios)'
        required: false
        default: ''
        type: string
      hasta:
        description: 'Fin del hueco (ISO, UTC) (modo gremios)'
        required: false
        default: ''
        type: string
      maquinas:
        description: 'Cuántas máquinas (1-12)'
        required: false
        default: '8'
        type: string
      # Parte 207: `ids` = barrido por id repartido en máquinas (lo pide solo scrape.js con `pedirBarrido`).
      modo:
        description: 'gremios (por ventana de tiempo) o ids (barrido por id de los rangos)'
        required: false
        default: 'gremios'
        type: string
      rangos:
        description: 'Modo ids: lo-hi,lo-hi,… (ids de evento)'
        required: false
        default: ''
        type: string
      canario:
        description: 'Modo ids: id de una kill publicada (tiene que dar 200 al empezar y al terminar)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      partes: ${{ steps.p.outputs.partes }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGION: ${{ inputs.region }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          MAQUINAS: ${{ inputs.maquinas }}
          MODO: ${{ inputs.modo }}
          RANGOS: ${{ inputs.rangos }}
          CANARIO: ${{ inputs.canario }}
        run: |
          case "$REGION" in americas|europe|asia) ;; *) echo "región inválida: $REGION"; exit 1 ;; esac
          n="$MAQUINAS"
          [[ "$n" =~ ^[0-9]+$ ]] || n=8
          [ "$n" -ge 1 ] || n=1
          [ "$n" -le 12 ] || n=12
          if [ "$MODO" = "ids" ]; then
            [[ "$RANGOS" =~ ^[0-9]+-[0-9]+(,[0-9]+-[0-9]+)*$ ]] || { echo "rangos inválidos"; exit 1; }
            [[ "$CANARIO" =~ ^[0-9]+$ ]] || { echo "modo ids: falta 'canario'"; exit 1; }
            # Revisión p207: el barrido nunca pasa de 4 máquinas (tope de 20 trabajos simultáneos de la cuenta).
            [ "$n" -le 4 ] || n=4
            echo "partes=[$(seq -s, 0 $((n - 1)))]" >> "$GITHUB_OUTPUT"
            primero="${RANGOS%%,*}"
            tag="rescate-$REGION-ids-${primero}-$GITHUB_RUN_ID"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --latest=false \
              --title "Barrido por id $REGION ($(echo "$RANGOS" | tr ',' '\n' | wc -l) rangos)" \
              --notes "Barrido por id de $REGION en $n partes (parte 207). Rangos: ${RANGOS:0:2000}. Las carga scrape.js sin duplicar y saca de su cola los ids confirmados. Corrida $GITHUB_RUN_ID."
            exit 0
          fi
          echo "partes=[$(seq -s, 0 $((n - 1)))]" >> "$GITHUB_OUTPUT"
          [ -n "$DESDE" ] && [ -n "$HASTA" ] || { echo "modo gremios: faltan 'desde' y 'hasta'"; exit 1; }
          d=$(date -u -d "$DESDE" +%s) && h=$(date -u -d "$HASTA" +%s) || { echo "fechas inválidas"; exit 1; }
          [ "$h" -gt "$d" ] || { echo "'hasta' tiene que ser después de 'desde'"; exit 1; }
          # Más de 10 días no tiene sentido: la ventana de 1.051 kills de cada gremio no llega tan atrás.
          [ $((h - d)) -le 864000 ] || { echo "hueco de más de 10 días: usar varios rescates"; exit 1; }
          tag="rescate-$REGION-$(date -u -d "$DESDE" +%Y%m%dT%H%M)-$GITHUB_RUN_ID"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Rescate $REGION $DESDE → $HASTA" \
            --notes "Kills rescatadas por gremio y por jugador del hueco $DESDE → $HASTA ($REGION), en $n partes. Las carga scrape.js sin duplicar. Corrida $GITHUB_RUN_ID."

  barrer:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      # Revisión p207: en el modo ids «preparar» ya da como mucho 4 partes (el escáner encadenado no puede quedar en cola).
      # Sin `max-parallel` con expresión: GitHub rechazó el archivo (corrida 43635107106, «workflow file issue»).
      matrix:
        parte: ${{ fromJSON(needs.preparar.outputs.partes) }}
    steps:
      # Solo los archivos de la raíz (rescate.mjs y scrape.js, de donde salen las funciones de las líneas).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (fijada por SHA, como scrape.yml)
        with:
          filter: blob:none
          sparse-checkout: |
            .github
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
      - name: IP de esta máquina (el límite de Albion es por IP)
        run: |
          echo "IP pública de esta máquina = $(curl -s --max-time 10 https://api.ipify.org || echo desconocida)"
      - name: Rescatar
        env:
          REGION: ${{ inputs.region }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          SHARD: ${{ matrix.parte }}
          SHARDS: ${{ strategy.job-total }}
          PRESUPUESTO_MIN: '320'
          MODO: ${{ inputs.modo }}
          RANGOS: ${{ inputs.rangos }}
          CANARIO: ${{ inputs.canario }}
        run: |
          OUT="rescate-$REGION-parte$SHARD.ndjson.gz" node rescate.mjs
      - name: Subir a la release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preparar.outputs.tag }}
        run: |
          shopt -s nullglob
          f=(rescate-*.ndjson.gz rescate-*.json)
          if [ ${#f[@]} -eq 0 ]; then echo "::warning::esta parte no dejó archivos"; exit 0; fi
          gh release upload "$TAG" "${f[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          cat rescate-*.json >> "$GITHUB_STEP_SUMMARY" || true
