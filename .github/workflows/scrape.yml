name: scrape
on:
  schedule:
    # Red de seguridad, NO el mecanismo principal — ver abajo. Cada 4h por si la cadena de
    # auto-relanzamiento se corta (fallo de red al re-disparar, runner caído, etc.).
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

concurrency:
  group: scrape-loop
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # El límite duro de GitHub-hosted runners es 360 min (6h). Dejamos margen para
    # checkout/install/el paso final de re-disparo.
    timeout-minutes: 345
    steps:
      # 2026-10-03: el checkout completo bajaba los 4,2 GB del histórico de julio-septiembre y tardaba
      # 16,5 min (medido en la corrida 37081418577). Ese rato nadie escaneaba, y en Europa en hora pico la
      # API solo guarda ~10 min de kills hacia atrás: cada relanzamiento (cada 5 h 40 min) dejaba un hueco
      # (visto el 02/10 a las 18:15 y a las 23:58 UTC). De este repo el scraper solo usa scrape.js,
      # package.json, data/status.json, data/state.json y data/gold/ (kills, peleas y equipo van a los
      # repos mensuales): con esto el checkout tarda segundos. Probado en local: 2 s.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (auditoría p92 H7: fijada por SHA, Node 24)
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            data/gold
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
      - run: npm install

      - name: Configurar identidad de git para los commits automáticos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 2026-07-25: Firestore se descartó — a 60s de intervalo real (una vez arreglado el cron)
      # la cuota gratis de 20.000 escrituras/día se agotaba a media tarde y todo lo demás del día
      # se perdía (RESOURCE_EXHAUSTED). Ahora `scrape.js` escribe LOCAL (archivos dentro de este
      # checkout, sin red, sin cuota) y este loop los sube a git cada ~15 min, no cada 60s — así
      # el historial de commits no se infla y el push no compite por tiempo con el scrape.
      - name: Scrape cada 60s, commit+push cada ~15 min, durante ~5h40m
        env:
          # Sin este secreto NO pasa nada malo: `DATA_REPOS_DIR` queda vacío, `scrape.js` escribe
          # donde escribió siempre y el workflow se comporta igual que antes del reparto en varios
          # repos. Es la invariante que hace que este cambio no pueda romper la recolección.
          # `GITHUB_TOKEN` no sirve acá: está limitado a ESTE repo y no puede escribir en otro.
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          # Auditoría p92 H6: el nombre de rama por env, no pegado en el script (se expandía antes de bash).
          REF_NAME: ${{ github.ref_name }}
        run: |
          END=$((SECONDS + 20400))
          LAST_PUSH=$SECONDS
          REGIONES="europe americas asia"
          MES_CLONADO=""

          # Deja en `datarepos/<región>` un clon del repo de ESE mes. Se vuelve a llamar en cada
          # vuelta porque un job dura ~5h40m y puede cruzar un cambio de mes: sin esto, los
          # primeros días de octubre se escribirían dentro del clon de septiembre y la app no los
          # encontraría. `--depth 1` porque solo hace falta la punta para agregar encima.
          # Crea (si falta) el repo mensual de una región: público y con un commit inicial, para
          # que se pueda clonar. El token necesita "Administration: write" sobre "All repositories"
          # además de "Contents: write". Si ya existe, GitHub responde 422 y no pasa nada.
          crear_repo() {
            curl -s -o /dev/null -w "%{http_code}" -X POST               -H "Authorization: Bearer $DATA_REPO_TOKEN" -H "Accept: application/vnd.github+json"               https://api.github.com/user/repos               -d "{\"name\":\"$1\",\"private\":false,\"auto_init\":true,\"description\":\"Datos del scraper de Albion World ($1)\"}"
          }

          # Desde el día 25, deja listos los repos del mes que viene (así el día 1 no depende de
          # crearlos a la carrera). Una vez por corrida.
          PROXIMO_CREADO=""
          preparar_mes_siguiente() {
            [ -z "$DATA_REPO_TOKEN" ] && return 0
            [ -n "$PROXIMO_CREADO" ] && return 0
            [ "$(date -u +%d)" -lt 25 ] && return 0
            MES_SIG=$(date -u -d "$(date -u +%Y-%m-01) +1 month" +%Y-%m)
            for R in $REGIONES; do
              echo "repo albion-data-$R-$MES_SIG: $(crear_repo "albion-data-$R-$MES_SIG")"
            done
            PROXIMO_CREADO=1
          }

          preparar_repos() {
            preparar_mes_siguiente
            MES_HOY=$(date -u +%Y-%m)
            if [ "$MES_HOY" = "$MES_CLONADO" ]; then return 0; fi
            if [ -z "$DATA_REPO_TOKEN" ]; then return 1; fi
            for R in $REGIONES; do
              REPO="albion-data-$R-$MES_HOY"
              rm -rf "datarepos/$R"
              mkdir -p datarepos
              URL="https://x-access-token:$DATA_REPO_TOKEN@github.com/${{ github.repository_owner }}/$REPO.git"
              # Clon parcial (2026-10-03): un repo mensual de Europa llega a ~1,4 GB a fin de mes y el clon
              # completo de las tres regiones se comía minutos de cada arranque. `ajustar_dias` deja en el
              # disco solo los archivos de hoy y de ayer, que son los únicos que el scraper lee y escribe.
              if ! git clone --depth 1 --filter=blob:none --sparse -q "$URL" "datarepos/$R"; then
                # No existe todavía: se crea y se reintenta una vez.
                echo "creando $REPO: $(crear_repo "$REPO")"
                sleep 5
                if ! git clone --depth 1 --filter=blob:none --sparse -q "$URL" "datarepos/$R"; then
                  echo "::error::no se pudo clonar ni crear $REPO — revisa que DATA_REPO_TOKEN tenga Contents y Administration (write) sobre All repositories"
                  return 1
                fi
              fi
              git -C "datarepos/$R" config user.name "github-actions[bot]"
              git -C "datarepos/$R" config user.email "github-actions[bot]@users.noreply.github.com"
            done
            MES_CLONADO="$MES_HOY"
            DIAS_AJUSTADOS=""
            return 0
          }

          # Archivos de los repos mensuales que quedan en el disco: los de hoy y ayer (kills, peleas y
          # equipo). Se vuelve a ajustar al cambiar el día UTC; los de anteayer ya están subidos y salen
          # del disco (si alguno tuviera cambios sin subir, git no lo saca). Un archivo que todavía no
          # existe igual queda en la lista, así `git add -A` lo toma cuando el scraper lo cree.
          DIAS_AJUSTADOS=""
          ajustar_dias() {
            [ -z "$MES_CLONADO" ] && return 0
            HOY=$(date -u +%Y-%m-%d)
            [ "$HOY" = "$DIAS_AJUSTADOS" ] && return 0
            # 2026-10-03 (auditoría p60): antes de achicar el checkout se sube lo pendiente; un archivo
            # modificado que queda fuera del checkout ya no se puede agregar (git lo ignora).
            [ -n "$DIAS_AJUSTADOS" ] && push_datarepos
            AYER=$(date -u -d "$HOY -1 day" +%Y-%m-%d)
            PATRONES="/README.md"
            for T in kills battles equipment; do
              PATRONES="$PATRONES /$T/$HOY.ndjson /$T/$AYER.ndjson"
            done
            for R in $REGIONES; do
              [ -d "datarepos/$R" ] || continue
              git -C "datarepos/$R" sparse-checkout set --no-cone $PATRONES || echo "::warning::sparse-checkout de $R falló"
            done
            DIAS_AJUSTADOS="$HOY"
          }

          push_datarepos() {
            if [ -z "$MES_CLONADO" ]; then return 0; fi
            for R in $REGIONES; do
              [ -d "datarepos/$R" ] || continue
              if [ -n "$(git -C "datarepos/$R" status --porcelain)" ]; then
                # 2026-10-11 (parte 103 de la app): al cambiar el día UTC el scraper puede escribir el archivo del
                # día nuevo antes de que `ajustar_dias` lo sume al checkout; con git >= 2.4x `add -A` sale con
                # error 1 y, con `bash -e`, cortaba el escáner y se perdían los últimos minutos del día (corridas
                # 38094602684 del 10/10 y la del 05/10 a las 00:00 UTC). `--sparse` agrega también esos archivos.
                git -C "datarepos/$R" add --sparse -A
                # 2026-10-03 (auditoría p60, probado en Linux): un archivo fuera del checkout reducido
                # aparece en `status` pero `add -A` no lo toma; el commit vacío fallaba y, con `bash -e`,
                # cortaba el escáner entero. Solo se commitea si hay algo preparado.
                if git -C "datarepos/$R" diff --cached --quiet; then
                  echo "::warning::$R: cambios fuera del checkout sin subir: $(git -C "datarepos/$R" status --porcelain | head -3 | tr '\n' ' ')"
                  continue
                fi
                git -C "datarepos/$R" commit -q -m "Datos $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                git -C "datarepos/$R" push -q origin HEAD || echo "push de $R falló, se reintenta en el próximo ciclo"
              fi
            done
          }
          # 2026-09-21: el `git pull --rebase ... || true` de abajo dejó marcadores de conflicto
          # DENTRO de los .json de datos el 2026-07-28 y el `git add data` los subió tal cual. A
          # partir de ahí `JSON.parse` fallaba en cada corrida y precios, oro y guild-stats
          # quedaron muertos OCHO SEMANAS sin que nada avisara. Estas dos guardas cierran las dos
          # mitades del agujero: el rebase que falla se aborta en vez de dejar el árbol a medias,
          # y nada con marcadores de conflicto puede llegar a un commit.
          # Solo los archivos que CAMBIARON, no todo `data/`: `git grep -- data` recorre el árbol
          # de trabajo entero, que son 4,2 GB, y tardaba minutos en cada ciclo de push. Los que
          # cambiaron son un puñado y es donde puede aparecer un marcador nuevo; los que no
          # cambiaron ya pasaron por esta misma comprobación cuando se commitearon.
          # Solo los archivos que CAMBIARON, no todo `data/`: `git grep -- data` recorre el
          # arbol de trabajo entero, que son 4,2 GB, y tardaba minutos en cada ciclo de push.
          # Los que cambiaron son un punado y es donde puede aparecer un marcador nuevo; los que
          # no cambiaron ya pasaron por esta misma comprobacion cuando se commitearon.
          abortar_si_hay_conflicto() {
            SUCIOS=""
            while IFS= read -r ARCHIVO; do
              if [ -f "$ARCHIVO" ] && grep -lI -e '^<<<<<<< ' -e '^>>>>>>> ' "$ARCHIVO" >/dev/null 2>&1; then
                SUCIOS="$SUCIOS $ARCHIVO"
              fi
            done <<< "$(git status --porcelain -- data | sed 's/^...//')"
            if [ -n "$SUCIOS" ]; then
              echo "::error::Marcadores de conflicto en data/ — no se commitea. Archivos afectados:$SUCIOS"
              return 1
            fi
            return 0
          }
          push_if_dirty() {
            if [ -n "$(git status --porcelain -- data)" ]; then
              abortar_si_hay_conflicto || return 0
              git add data
              # Mismo resguardo que en los repos mensuales: sin nada preparado, el commit fallaría y cortaría todo.
              if git diff --cached --quiet; then return 0; fi
              git commit -m "Scraper snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)" -q
              if ! git pull --rebase --autostash -q origin "$REF_NAME"; then
                echo "::warning::rebase con conflicto — se aborta y se reintenta en el próximo ciclo"
                git rebase --abort 2>/dev/null || true
                git stash pop 2>/dev/null || true
                return 0
              fi
              abortar_si_hay_conflicto || return 0
              git push -q origin "HEAD:$REF_NAME" || echo "push falló, se reintenta en el próximo ciclo"
            fi
          }
          while [ "$SECONDS" -lt "$END" ]; do
            START_ITER=$SECONDS
            if preparar_repos; then
              ajustar_dias
              export DATA_REPOS_DIR="$PWD/datarepos"
            else
              unset DATA_REPOS_DIR
            fi
            npm start || echo "scrape falló esta vuelta, se sigue con la siguiente"
            if [ $((SECONDS - LAST_PUSH)) -ge 900 ]; then
              push_if_dirty
              push_datarepos
              LAST_PUSH=$SECONDS
            fi
            ELAPSED=$((SECONDS - START_ITER))
            SLEEP_FOR=$((60 - ELAPSED))
            if [ "$SLEEP_FOR" -gt 0 ]; then
              sleep "$SLEEP_FOR"
            fi
          done
          push_if_dirty
          push_datarepos

      # Re-dispara este mismo workflow antes de que el runner llegue al límite de 6h, para
      # continuidad 24/7 sin depender del cron de GitHub. `always()` para que la cadena no se
      # corte aunque alguna vuelta de scrape haya fallado.
      - name: Encadenar siguiente ciclo
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/scrape.yml/dispatches" \
            -d "{\"ref\":\"$REF_NAME\"}"
