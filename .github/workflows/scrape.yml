name: scrape
on:
  schedule:
    # Red de seguridad, NO el mecanismo principal — ver abajo. Cada 4h por si la cadena de
    # auto-relanzamiento se corta (fallo de red al re-disparar, runner caído, etc.).
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

concurrency:
  group: scrape-loop
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # El límite duro de GitHub-hosted runners es 360 min (6h). Dejamos margen para
    # checkout/install/el paso final de re-disparo.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      - name: Configurar identidad de git para los commits automáticos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 2026-07-25: Firestore se descartó — a 60s de intervalo real (una vez arreglado el cron)
      # la cuota gratis de 20.000 escrituras/día se agotaba a media tarde y todo lo demás del día
      # se perdía (RESOURCE_EXHAUSTED). Ahora `scrape.js` escribe LOCAL (archivos dentro de este
      # checkout, sin red, sin cuota) y este loop los sube a git cada ~15 min, no cada 60s — así
      # el historial de commits no se infla y el push no compite por tiempo con el scrape.
      - name: Scrape cada 60s, commit+push cada ~15 min, durante ~5h40m
        run: |
          END=$((SECONDS + 20400))
          LAST_PUSH=$SECONDS
          # 2026-09-21: el `git pull --rebase ... || true` de abajo dejó marcadores de conflicto
          # DENTRO de los .json de datos el 2026-07-28 y el `git add data` los subió tal cual. A
          # partir de ahí `JSON.parse` fallaba en cada corrida y precios, oro y guild-stats
          # quedaron muertos OCHO SEMANAS sin que nada avisara. Estas dos guardas cierran las dos
          # mitades del agujero: el rebase que falla se aborta en vez de dejar el árbol a medias,
          # y nada con marcadores de conflicto puede llegar a un commit.
          abortar_si_hay_conflicto() {
            if git grep -qI -e '^<<<<<<< ' -e '^>>>>>>> ' -- data; then
              echo "::error::Marcadores de conflicto en data/ — no se commitea. Archivos afectados:"
              git grep -lI -e '^<<<<<<< ' -e '^>>>>>>> ' -- data
              return 1
            fi
            return 0
          }
          push_if_dirty() {
            if [ -n "$(git status --porcelain -- data)" ]; then
              abortar_si_hay_conflicto || return 0
              git add data
              git commit -m "Scraper snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)" -q
              if ! git pull --rebase --autostash -q origin "${{ github.ref_name }}"; then
                echo "::warning::rebase con conflicto — se aborta y se reintenta en el próximo ciclo"
                git rebase --abort 2>/dev/null || true
                git stash pop 2>/dev/null || true
                return 0
              fi
              abortar_si_hay_conflicto || return 0
              git push -q origin "HEAD:${{ github.ref_name }}" || echo "push falló, se reintenta en el próximo ciclo"
            fi
          }
          while [ "$SECONDS" -lt "$END" ]; do
            START_ITER=$SECONDS
            npm start || echo "scrape falló esta vuelta, se sigue con la siguiente"
            if [ $((SECONDS - LAST_PUSH)) -ge 900 ]; then
              push_if_dirty
              LAST_PUSH=$SECONDS
            fi
            ELAPSED=$((SECONDS - START_ITER))
            SLEEP_FOR=$((60 - ELAPSED))
            if [ "$SLEEP_FOR" -gt 0 ]; then
              sleep "$SLEEP_FOR"
            fi
          done
          push_if_dirty

      # Re-dispara este mismo workflow antes de que el runner llegue al límite de 6h, para
      # continuidad 24/7 sin depender del cron de GitHub. `always()` para que la cadena no se
      # corte aunque alguna vuelta de scrape haya fallado.
      - name: Encadenar siguiente ciclo
        if: always()
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
